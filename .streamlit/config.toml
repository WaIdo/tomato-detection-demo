[server]
headless = true
address = "0.0.0.0"
maxUploadSize = 2
maxMessageSize = 16
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#18755f"
backgroundColor = "#f8faf9"
secondaryBackgroundColor = "#eef3f1"
textColor = "#000000"
font = "serif"
